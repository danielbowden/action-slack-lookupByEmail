name: "units-test"
on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  # unit tests
  units:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        package-manager-cache: false
    - run: npm ci
    - run: npm run lint
    - run: npm test
    - run: npm audit
    - name: Exercise the packaged action with a mocked Slack response
      id: slack-user
      uses: ./
      with:
        email: daniel@example.com
      env:
        SLACK_BOT_TOKEN: test-token
        NODE_OPTIONS: --import=${{ github.workspace }}/test/fixtures/slack.js
    - name: Verify the consumer output contract
      env:
        USER_ID: ${{ fromJSON(steps.slack-user.outputs.user).id }}
      run: test "$USER_ID" = A00000001
